# Dependency vulnerability scanning / update PRs (RAC §2, §9)
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    # Avoid disruptive major bumps (Dependabot opened TS 7 / ESLint 10 PRs).
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      production-patch-minor:
        dependency-type: production
        update-types:
          - "minor"
          - "patch"
      development-patch-minor:
        dependency-type: development
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - security
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
